<div class="empty-state">
  <i class="bi bi-{{ icon|default:'inbox' }}"></i>
  <h6>{{ title|default:"Aucun résultat" }}</h6>
  <p class="mb-3 small">{{ text|default:"Aucun élément ne correspond à vos critères." }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>{{ action_label }}</a>{% endif %}
</div>
