<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="post">{% csrf_token %}
      <div class="modal-body p-4 d-flex gap-3">
        <div class="kpi-icon tone-red"><i class="bi bi-exclamation-triangle"></i></div>
        <div>
          <h5 class="mb-1" data-confirm-title>Confirmer</h5>
          <p class="text-muted mb-0" data-confirm-text></p>
        </div>
      </div>
      <div class="modal-footer bg-light border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-danger" data-confirm-submit>Supprimer</button>
      </div>
    </form>
  </div>
</div>
