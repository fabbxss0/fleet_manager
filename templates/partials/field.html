{# Rendu d'un champ : libellé, astérisque si obligatoire, erreurs, aide #}
<div class="{{ col|default:'col-md-6' }} mb-3">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check mt-4">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label|capfirst }}{% if field.field.required %}<span class="req">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
</div>
