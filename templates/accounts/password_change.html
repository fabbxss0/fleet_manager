{% extends "base.html" %}
{% block content %}
<form class="card mx-auto" style="max-width:620px" method="post" novalidate>{% csrf_token %}
  <div class="card-header"><i class="bi bi-key"></i> Changer mon mot de passe</div>
  <div class="fm-form-section"><div class="row">
    {% include "partials/form_errors.html" %}
    {% for field in form %}{% include "partials/field.html" with field=field col="col-12" %}{% endfor %}
  </div></div>
  <div class="fm-form-actions"><a href="{% url 'accounts:profile' %}" class="btn btn-light">Annuler</a><button class="btn btn-primary">Modifier le mot de passe</button></div>
</form>
{% endblock %}
